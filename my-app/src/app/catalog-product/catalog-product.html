<p>catalog-product works!</p>
<table border="1">
  <tr>
    <td colspan="2">Ma Danh Muc</td>
    <td colspan="2">Ten Danh Muc</td>
  </tr>
  <ng-container *ngFor="let cate of datas">
    <tr>
      <td colspan="2" class="category">
        {{ cate.Cateid }}
      </td>

      <td colspan="2" class="category">
        {{ cate.CateName }}
      </td>
    </tr>

    <tr>
      <td>Ma San Pham</td>
      <td>Ten San Pham</td>
      <td>Gia San Pham</td>
      <td>Picture</td>
    </tr>

    <tr *ngFor="let product of cate.Products">

      <td>
        {{ product.ProductId }}
      </td>

      <td>
        {{ product.ProductName }}
      </td>

      <td>
        {{ product.Price }}
      </td>

      <td>
        <img
          [src]="product.Image"
          alt="{{ product.ProductName }}" width="70" height="70"> 
      </td>
    </tr>
  </ng-container>
</table>
